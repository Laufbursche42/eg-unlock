<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://api.my-egret.com https://*.my-egret.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="pageTitle">Laufbursche Egret Tool</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="stylesheet" href="styles.css?v=17">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Laufbursche <span data-t="brandSub"></span></h1>
    <div class="head-right">
      <span class="status" id="status" data-state="disconnected">disconnected</span>
      <div class="head-tools">
        <button type="button" class="theme-btn" id="btn-theme">&#9728;</button>
        <div class="langs" id="langs" role="group">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <p class="hint infobox" data-t="infoBannerHtml"></p>

  <div class="card">
    <h2 data-t="s1Title"></h2>
    <p class="hint" data-t="sub"></p>
    <p class="hint" data-t="startHintGuide"></p>
    <p class="warn" data-t="expWarn"></p>
    <p class="hint" data-t="ownDevice"></p>
  </div>

  <div class="card">
    <h2 data-t="s2Title"></h2>
    <div class="set-row">
      <label data-t="modelLabel"></label>
      <select id="model-in"></select>
    </div>
    <p class="hint" data-t="modelHint"></p>
    <div class="btns">
      <button class="primary span2" id="btn-conn" data-act="connect"></button>
    </div>
    <p class="hint" id="devinfo"></p>
    <p class="hint" data-t="controlsHint"></p>
  </div>

  <div class="card" id="live-card" hidden>
    <h2 data-t="liveTitle"></h2>
    <div class="grid">
      <div class="tile"><b id="t-speed">-</b><small data-t="tileSpeed"></small></div>
      <div class="tile"><b id="t-mode">-</b><small data-t="tileMode"></small></div>
      <div class="tile"><b id="t-lock">-</b><small data-t="tileLock"></small></div>
      <div class="tile"><b id="t-light">-</b><small data-t="tileLight"></small></div>
      <div class="tile"><b id="t-poweredon">-</b><small data-t="tilePowered"></small></div>
      <div class="tile"><b id="t-power">-</b><small data-t="tilePower"></small></div>
      <div class="tile"><b id="t-throttle">-</b><small data-t="tileThrottle"></small></div>
      <div class="tile"><b id="t-rangefactor">-</b><small data-t="tileRangeFactor"></small></div>
      <div class="tile"><b id="t-odo">-</b><small data-t="tileOdo"></small></div>
      <div class="tile"><b id="t-trip">-</b><small data-t="tileTrip"></small></div>
      <div class="tile"><b id="t-temp">-</b><small data-t="tileTemp"></small></div>
      <div class="tile"><b id="t-rpm">-</b><small data-t="tileRpm"></small></div>
      <div class="tile"><b id="t-tempstate">-</b><small data-t="tileTempState"></small></div>
      <div class="tile"><b id="t-err">-</b><small data-t="tileErr"></small></div>
      <div class="tile"><b id="t-fw">-</b><small data-t="tileFw"></small></div>
      <div class="tile"><b id="t-serial">-</b><small data-t="tileSerial"></small></div>
    </div>
    <p class="hint" data-t="liveHint"></p>
  </div>

  <div class="card" id="batt-card" hidden>
    <div class="card-head"><h2 data-t="battTitle"></h2><button type="button" class="help-btn" data-help="batt" aria-label="Info">?</button></div>
    <div class="grid">
      <div class="tile"><b id="t-batt">-</b><small data-t="tileBatt"></small></div>
      <div class="tile"><b id="t-range">-</b><small data-t="tileRange"></small></div>
      <div class="tile"><b id="t-volt">-</b><small data-t="tileVolt"></small></div>
      <div class="tile"><b id="t-current">-</b><small data-t="tileCurrent"></small></div>
      <div class="tile"><b id="t-batttemp">-</b><small data-t="tileBattTemp"></small></div>
      <div class="tile"><b id="t-cycles">-</b><small data-t="tileCycles"></small></div>
      <div class="tile"><b id="t-capacity">-</b><small data-t="tileCapacity"></small></div>
      <div class="tile"><b id="t-battfw">-</b><small data-t="tileBattFw"></small></div>
      <div class="tile"><b id="t-charge">-</b><small data-t="tileCharge"></small></div>
    </div>
    <p class="hint" data-t="battHint"></p>
  </div>

  <div class="card" id="more-card" hidden>
    <div class="card-head"><h2 data-t="moreTitle"></h2><button type="button" class="help-btn" data-help="more" aria-label="Info">?</button></div>

    <h3 class="set-group" data-t="setgrpSpeed"></h3>
    <div id="card-speed">
      <div class="btns">
        <button class="primary span2" id="btn-toggle" disabled></button>
      </div>
      <div class="two">
        <div class="fld"><label data-t="lblOpen"></label><input id="open-in" type="number" step="1" min="1" max="99" value="45"></div>
        <div class="fld"><label data-t="lblEkfv"></label><input id="ekfv-in" type="number" step="1" min="1" max="99" value="20"></div>
      </div>
      <p class="hint" id="speed-current"></p>
    </div>
    <div id="card-ey">
      <div class="set-row">
        <label data-t="lblGear"></label>
        <select id="gear-in" disabled></select>
        <button id="btn-gear" data-t="btnSetGear" disabled></button>
      </div>
      <p class="hint" id="ey-noxmode" data-t="eyNoXmode" hidden></p>
    </div>

    <h3 class="set-group" data-t="setgrpGeneral"></h3>
    <div id="card-mode">
      <div class="set-row">
        <label data-t="lblMode"></label>
        <select id="mode-in" disabled>
          <option value="0" data-t="modeOff"></option>
          <option value="1" data-t="modeEco"></option>
          <option value="2" data-t="modeTour"></option>
          <option value="3" data-t="modeSport"></option>
        </select>
        <button id="btn-mode" data-t="btnSetMode" disabled></button>
      </div>
    </div>
    <div class="set-row" id="row-bright" hidden>
      <label data-t="lblBright"></label>
      <select id="bright-in" disabled>
        <option value="-1" data-t="brAuto"></option>
        <option value="0" data-t="br25"></option>
        <option value="1" data-t="br50"></option>
        <option value="2" data-t="br75"></option>
        <option value="3" data-t="br100"></option>
      </select>
      <button id="btn-bright" data-t="btnSet" disabled></button>
    </div>
    <div class="set-row" id="row-headlight" hidden>
      <label data-t="lblHeadlight"></label>
      <select id="headlight-in" disabled>
        <option value="0" data-t="hlOff"></option>
        <option value="1" data-t="hl1"></option>
        <option value="2" data-t="hl2"></option>
        <option value="3" data-t="hl3"></option>
        <option value="4" data-t="hl4"></option>
      </select>
      <button id="btn-headlight" data-t="btnSet" disabled></button>
    </div>
    <div class="set-row" id="row-light">
      <label data-t="lblLight"></label>
      <select id="light-in"><option value="1" data-t="btnOn"></option><option value="0" data-t="btnOff"></option></select>
      <button id="btn-light" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row" id="row-unit">
      <label data-t="lblUnit"></label>
      <select id="unit-in"><option value="0" data-t="optKm"></option><option value="1" data-t="optMi"></option></select>
      <button id="btn-unit" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row" id="row-lang" hidden>
      <label data-t="lblLang"></label>
      <select id="lang-in" disabled>
        <option value="0" data-t="langDe"></option>
        <option value="1" data-t="langEn"></option>
        <option value="2" data-t="langFr"></option>
        <option value="3" data-t="langEs"></option>
      </select>
      <button id="btn-lang" data-t="btnSet" disabled></button>
    </div>
    <div class="set-row" id="row-alwayson" hidden>
      <label data-t="lblAlwaysOn"></label>
      <select id="alwayson-in"><option value="1" data-t="btnOn"></option><option value="0" data-t="btnOff"></option></select>
      <button id="btn-alwayson" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row" id="row-tempwarn" hidden>
      <label data-t="lblTempWarn"></label>
      <select id="tempwarn-in">
        <option value="0" data-t="twOff"></option>
        <option value="1" data-t="twLow"></option>
        <option value="2" data-t="twHigh"></option>
      </select>
      <button id="btn-tempwarn" data-t="btnSet" disabled></button>
    </div>
    <div class="set-row" id="row-range" hidden>
      <label data-t="lblRange"></label>
      <input id="range-in" type="number" step="1" min="0" max="100" value="100">
      <button id="btn-range" data-t="btnSet" disabled></button>
    </div>
    <div class="set-row" id="row-unlockreq" hidden>
      <label data-t="lblUnlockReq"></label>
      <select id="unlockreq-in"><option value="1" data-t="btnOn"></option><option value="0" data-t="btnOff"></option></select>
      <button id="btn-unlockreq" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row" id="row-unlockcode" hidden>
      <label data-t="lblUnlockCode"></label>
      <input id="unlockcode-in" type="text" maxlength="4" data-t-ph="unlockCodePh">
      <button id="btn-unlockcode" data-t="btnSet" disabled></button>
    </div>
    <div class="set-row" id="row-text" hidden>
      <label data-t="lblText"></label>
      <input id="text-in" type="text" maxlength="18" data-t-ph="textPlaceholder">
      <button id="btn-text" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row" id="row-custname" hidden>
      <label data-t="lblCustName"></label>
      <input id="custname-in" type="text" maxlength="20">
      <button id="btn-custname" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row" id="row-cruise" hidden>
      <label data-t="lblCruise"></label>
      <select id="cruise-in"><option value="1" data-t="btnOn"></option><option value="0" data-t="btnOff"></option></select>
      <button id="btn-cruise" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row" id="row-reset" hidden>
      <label data-t="resetLabel"></label>
      <button id="btn-reset-trip" data-t="btnResetTrip" disabled></button>
      <button id="btn-reset-total" data-t="btnResetTotal" disabled></button>
    </div>
    <div class="set-row" id="card-immob">
      <label data-t="immobTitle"></label>
      <button id="btn-immob-unlock" data-t="btnImmobUnlock" disabled></button>
      <button id="btn-immob-lock" data-t="btnImmobLock" disabled></button>
    </div>
  </div>

  <div class="card" id="raw-card" hidden>
    <div class="card-head"><h2 data-t="rawTitle"></h2></div>
    <p class="hint" data-t="rawHint"></p>
  </div>

  <div class="card" id="card-fw" hidden>
    <div class="card-head"><h2 data-t="fwTitle"></h2><button type="button" class="help-btn" data-help="firmware" aria-label="Info">?</button></div>
    <p class="warn" data-t="fwServerNote"></p>

    <div id="fw-login">
      <div class="set-row">
        <label data-t="fwEmail"></label>
        <input id="fw-email" type="email" autocomplete="username" data-t-ph="fwEmailPh">
      </div>
      <div class="btns">
        <button class="primary span2" id="fw-btn-magic" data-t="fwBtnMagic"></button>
      </div>
      <p class="hint" data-t="fwMagicHint"></p>
      <div class="set-row">
        <label data-t="fwLink"></label>
        <input id="fw-code" type="text" autocomplete="off" data-t-ph="fwLinkPh">
      </div>
      <div class="btns">
        <button class="primary span2" id="fw-btn-verify" data-t="fwBtnVerify"></button>
      </div>
    </div>

    <div id="fw-session" hidden>
      <p class="hint" id="fw-status"></p>
      <div class="two">
        <div class="fld"><label data-t="fwModel"></label><input id="fw-model" type="text" data-t-ph="fwModelPh"></div>
        <div class="fld"><label data-t="fwVersion"></label><input id="fw-version" type="text" data-t-ph="fwVersionPh"></div>
      </div>
      <div class="set-row">
        <label data-t="fwTarget"></label>
        <select id="fw-target">
          <option value="controller" data-t="fwTargetController"></option>
          <option value="display" data-t="fwTargetDisplay"></option>
          <option value="bluetooth" data-t="fwTargetBluetooth"></option>
          <option value="bms" data-t="fwTargetBms"></option>
        </select>
        <button id="fw-btn-check" data-t="fwBtnCheck"></button>
      </div>
      <div class="btns">
        <button id="fw-btn-list" class="span2" data-t="fwBtnList"></button>
      </div>
      <div id="fw-results"></div>
      <div class="btns">
        <button id="fw-btn-logout" class="span2" data-t="fwBtnLogout"></button>
      </div>
    </div>
    <p class="hint" data-t="fwHint"></p>
  </div>

  <div class="card">
    <h2 data-t="s6Title"></h2>
    <div class="log-opts">
      <div class="log-opt">
        <span data-t="publicLogLabel"></span>
        <input type="checkbox" id="public-log" checked>
        <button type="button" class="help-btn" data-help="publiclog" aria-label="Info">?</button>
      </div>
      <div class="log-opt">
        <span data-t="diagLogLabel"></span>
        <input type="checkbox" id="diag-log">
        <button type="button" class="help-btn" data-help="diaglog" aria-label="Info">?</button>
      </div>
    </div>
    <div class="btns">
      <button type="button" id="btn-copy-log" data-t="btnCopyLog"></button>
      <button type="button" id="btn-clear-log" data-t="btnClearLog"></button>
      <button type="button" id="btn-save-log" class="span2" data-t="btnSaveLog"></button>
    </div>
    <pre id="log"></pre>
    <p class="hint"><span class="log-tx" data-t="logTxLegend"></span>, <span class="log-rx" data-t="logRxLegend"></span></p>
  </div>

  <footer class="foot">
    <span class="foot-links">
      <a id="link-guide" href="GUIDE.de.md" data-doc="GUIDE" data-t="footGuide"></a>
      <a href="https://github.com/Laufbursche42/eg-unlock" target="_blank" rel="noopener" data-t="footSource"></a>
      <a id="link-readme" href="README.md" data-doc="README" data-t="footReadme"></a>
      <a id="link-disclaimer" href="#" data-t="footDisclaimer"></a>
      <a id="link-license" href="LICENSE.de.md" data-doc="LICENSE" data-t="footLicense"></a>
      <a id="link-privacy" href="PRIVACY.de.md" data-doc="PRIVACY" data-t="footPrivacy"></a>
      <a id="link-trademarks" href="TRADEMARKS.de.md" data-doc="TRADEMARKS" data-t="footTrademarks"></a>
    </span>
    <span class="foot-links"><span class="ver" id="build-ver"></span><a href="https://github.com/Laufbursche42/Laufbursche42/issues" target="_blank" rel="noopener" data-t="footIssue"></a></span>
    <a class="foot-copy" href="https://laufbursche42.github.io/Laufbursche42/" target="_blank" rel="noopener">Copyright (c) 2026 Laufbursche</a>
  </footer>
</div>

<dialog id="doc" aria-labelledby="doc-title">
  <div class="doc-head">
    <h3 id="doc-title"></h3>
    <button type="button" id="doc-x">&times;</button>
  </div>
  <div class="doc-body" id="doc-body"></div>
  <div class="doc-foot">
    <button type="button" id="doc-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="help" aria-labelledby="help-title">
  <div class="doc-head">
    <h3 id="help-title"></h3>
    <button type="button" id="help-x">&times;</button>
  </div>
  <div class="doc-body"><p id="help-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="help-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="confirm" aria-labelledby="confirm-title">
  <div class="doc-head">
    <h3 id="confirm-title" data-t="confirmTitle"></h3>
    <button type="button" id="confirm-x">&times;</button>
  </div>
  <div class="doc-body"><p id="confirm-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="confirm-no" data-t="confirmCancel"></button>
    <button type="button" id="confirm-ok" class="primary" data-t="confirmOk"></button>
  </div>
</dialog>

<script src="report-footer.js?v=17"></script>
<script src="i18n.js?v=17"></script>
<script src="app.js?v=17"></script>
</body>
</html>
